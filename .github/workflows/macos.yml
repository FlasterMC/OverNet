name: macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        type: string
      notes:
        description: What's new
        required: false
        type: string
      full:
        description: Full build
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: desktop
    env:
      VERSION: ${{ inputs.version }}
      SURFER_PLATFORM: darwin
      SURFER_COMPAT: aarch64
      SURFER_FORCE_CANDIDATE: 1
      ZEN_CROSS_COMPILING: 1
      ZEN_RELEASE: 1
      ZEN_GA_DISABLE_PGO: 1
      ZEN_DISABLE_LTO: 1
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
        run: |
          key="$(gh cache list -R "$GITHUB_REPOSITORY" --key obj- --sort created_at --order desc --limit 1 --json key --jq '.[0].key // empty')"
          base="${key#obj-}"
          fast=false
          if [ "$FULL" != true ] && [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD | grep -vE '^(\.github/|[^/]+\.md$|\.gitignore$|desktop/locales/|desktop/src/.*\.(mjs|js|css|ftl|html|xhtml|svg|png|jpg|webp|json)$)' | grep -q .; then
              fast=true
            fi
          fi
          if [ "$fast" = true ]; then echo "::notice::Быстрая сборка поверх $base"; else echo "::notice::Полная сборка"; fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: true

      - name: Dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y zstd yasm nasm build-essential m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev
          pip install mar
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-darwin
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Firefox
        run: |
          npm run surfer -- ci --brand release --display-version "$VERSION"
          npm run download

      - name: macOS tools
        working-directory: desktop/engine
        run: |
          mkdir -p ~/mac-cross
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/

      - name: Import
        run: |
          npm run import
          bash ../scripts/branding_prefs.sh
          bash scripts/mar_sign.sh -i
          npm run bootstrap
          sh scripts/download-language-packs.sh

      - uses: actions/cache/restore@v4
        if: steps.mode.outputs.fast == 'true'
        with:
          path: desktop/engine/obj-*
          key: ${{ steps.mode.outputs.key }}
          fail-on-cache-miss: true

      - name: Build
        env:
          FAST: ${{ steps.mode.outputs.fast }}
        run: |
          ulimit -n 4096
          export MOZ_BUILD_DATE="$(date -u +%Y%m%d%H%M%S)"
          if [ "$FAST" != true ]; then
            npm run build
            obj="$PWD/$(ls -d engine/obj-*)"
            grep -q "BuildID=$MOZ_BUILD_DATE" "$obj/dist/bin/platform.ini"
            grep -q "BuildID=$MOZ_BUILD_DATE" "$obj/dist/bin/application.ini"
            exit 0
          fi
          obj="$PWD/$(ls -d engine/obj-*)"
          touch "$obj/CLOBBER"
          printf '#define MOZ_BUILDID %s\n' "$MOZ_BUILD_DATE" > "$obj/buildid.h"
          rm -f "$obj/config.status" "$obj"/build/application.ini*
          make -C "$obj/xpcom/glue/standalone" target-objects
          npm run build:ui
          make -C "$obj/build" application.ini.h
          make -C "$obj/browser/app"
          grep -q "BuildID=$MOZ_BUILD_DATE" "$obj/dist/bin/platform.ini"
          grep -q "BuildID=$MOZ_BUILD_DATE" "$obj/dist/bin/application.ini"
          grep -q "^Version=$VERSION$" "$obj/dist/bin/application.ini"
          grep -qa "$MOZ_BUILD_DATE" "$obj/dist/bin/zen"

      - name: Package
        run: npm run package

      - name: Sign app
        run: |
          cargo install apple-codesign --locked
          obj="$PWD/$(ls -d engine/obj-*)"
          branding="$PWD/engine/browser/branding/release"
          stage="$obj/dist/zen"
          rcodesign sign "$stage/OverNet.app"
          rm -f dist/*.dmg dist/output.mar
          (cd engine && ./mach python -m mozbuild.action.make_dmg --dsstore "$branding/dsstore" --background "$branding/background.png" --icon "$branding/disk.icns" --volume-name OverNet "$stage" "$GITHUB_WORKSPACE/desktop/dist/OverNet-$VERSION.dmg")
          rm -rf "$obj/dist/OverNet.app"
          mv "$stage/OverNet.app" "$obj/dist/OverNet.app"
          JUST_MAR=1 npm run package

      - name: Sign update
        env:
          OVERNET_MAR_KEY: ${{ secrets.OVERNET_MAR_KEY }}
        run: |
          key="$RUNNER_TEMP/mar_key.pem"
          printf '%s' "$OVERNET_MAR_KEY" | base64 -d > "$key"
          info="$(mar -T dist/output.mar)"
          channel="$(sed -n 's/.*MAR channel name: //p' <<< "$info")"
          product="$(sed -n 's/.*Product version: //p' <<< "$info")"
          unpacked="$RUNNER_TEMP/mar"
          mkdir -p "$unpacked"
          mar -x dist/output.mar -C "$unpacked"
          (cd "$unpacked" && find . -type f | sed 's#^\./##') > "$RUNNER_TEMP/mar_files"
          rm dist/output.mar
          xargs -d '\n' mar -c dist/output.mar -C "$unpacked" -k "$key" -H "$channel" -V "$product" < "$RUNNER_TEMP/mar_files"
          openssl rsa -in "$key" -pubout -out "$RUNNER_TEMP/mar_pub.pem"
          mar -v dist/output.mar -k "$RUNNER_TEMP/mar_pub.pem"
          rm -f "$key"
          npm run surfer -- updates-browser

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$(ls -t dist/*.dmg | head -1)" "$RUNNER_TEMP/release/OverNet-$VERSION.dmg"
          cp dist/output.mar "$RUNNER_TEMP/release/macos.mar"
          if [ -z "$NOTES" ]; then
            previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            NOTES="$(git log --no-merges --format='- %s' ${previous:+$previous..}HEAD | grep -v '^- Squashed ' | head -50)"
          fi
          gh release create "$VERSION" "$RUNNER_TEMP/release/OverNet-$VERSION.dmg" "$RUNNER_TEMP/release/macos.mar" --title "OverNet $VERSION" --notes "${NOTES:-OverNet $VERSION}" --target "$GITHUB_SHA"

      - name: Update manifest
        run: |
          site="$RUNNER_TEMP/updates"
          if git ls-remote --exit-code origin updates > /dev/null; then
            git fetch origin updates
            git worktree add "$site" origin/updates
          else
            git worktree add --detach "$site"
            git -C "$site" checkout --orphan updates
            git -C "$site" rm -rfq .
          fi
          rm -rf "$site/updates"
          cp -R dist/update "$site/updates"
          git -C "$site" add -A
          git -C "$site" commit -qm "OverNet $VERSION"
          git -C "$site" push origin HEAD:updates

      - name: Prune build
        if: steps.mode.outputs.fast != 'true'
        run: |
          obj="$(ls -d engine/obj-*)"
          rm -rf "$obj/dist/zen"
          find "$obj" -name '*.o' -not -path '*/browser/app/*' -not -path '*/xpcom/glue/standalone/*' -delete
          find "$obj" -maxdepth 3 -type d -path '*/release/*' \( -name deps -o -name build -o -name incremental -o -name .fingerprint \) -prune -exec rm -rf {} +
          du -sh "$obj"

      - uses: actions/cache/save@v4
        if: steps.mode.outputs.fast != 'true'
        continue-on-error: true
        with:
          path: desktop/engine/obj-*
          key: obj-${{ github.sha }}

      - name: Drop old builds
        if: steps.mode.outputs.fast != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key obj- --json key --jq '.[].key' | grep -vx "obj-$GITHUB_SHA" | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY" || true
